services:
  baserow:
    image: ${BASEROW_IMAGE:-baserow/baserow:2.4.1}
    restart: unless-stopped
    environment:
      BASEROW_PUBLIC_URL: ${BASEROW_PUBLIC_URL:-http://localhost:8081}
      BASEROW_EXTRA_PUBLIC_URLS: http://baserow
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - baserow_data:/baserow/data

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.45.6}
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Paris}
      TZ: ${TIMEZONE:-Europe/Paris}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      BASEROW_INTERNAL_URL: http://baserow:80
      BASEROW_TABLE_COLLABORATORS_ID: ${BASEROW_TABLE_COLLABORATORS_ID:-366}
      BASEROW_TABLE_TECHNICIANS_ID: ${BASEROW_TABLE_TECHNICIANS_ID:-367}
      BASEROW_TABLE_TICKETS_ID: ${BASEROW_TABLE_TICKETS_ID:-368}
      BASEROW_TABLE_REPLIES_ID: ${BASEROW_TABLE_REPLIES_ID:-369}
      BASEROW_TABLE_KNOWLEDGEBASE_ID: ${BASEROW_TABLE_KNOWLEDGEBASE_ID:-370}
      BASEROW_TABLE_AUDITLOG_ID: ${BASEROW_TABLE_AUDITLOG_ID:-371}
      AI_CONFIDENCE_THRESHOLD: ${AI_CONFIDENCE_THRESHOLD:-0.6}
      SLA_HOURS_P1: ${SLA_HOURS_P1:-4}
      SLA_HOURS_P2: ${SLA_HOURS_P2:-8}
      SLA_HOURS_P3: ${SLA_HOURS_P3:-24}
      SLA_HOURS_P4: ${SLA_HOURS_P4:-72}
      SLA_WARNING_HOURS: ${SLA_WARNING_HOURS:-1}
      MAIL_FROM: ${MAIL_FROM:-helpdesk@example.test}
      APPROVER_EMAIL: ${APPROVER_EMAIL:-demo.approver@example.test}
      REPORT_EMAIL: ${REPORT_EMAIL:-demo.manager@example.test}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.21}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  baserow_data:
  n8n_data:
